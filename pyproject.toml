[project]
name = "voucher-forge"
version = "0.1.0"
description = "Deterministic voucher generator and print packing engine"
authors = [{ name = "iomatix" }]
requires-python = ">=3.11"
dependencies = [
    "reportlab>=4.0.0",
    "nicegui>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]